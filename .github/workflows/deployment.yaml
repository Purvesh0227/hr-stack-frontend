name: Deploy Frontend

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://hr-stack-backend.onrender.com
          VITE_VAPID_PUBLIC_KEY: BGomtdB5Rn44kz3YpYSf2cCbqOdLXIOeQTotyxLAcwkxyKEdFpZCbLiQ2CBiUmOGtF1Rk7DrI_SYUBNV-vN7nL4
        run: npm run build

      - name: Configure SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4