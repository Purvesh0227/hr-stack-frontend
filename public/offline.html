<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#0f172a" />

    <title>HR-Stack - Offline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .offline-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .offline-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 28px;
            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 20px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .offline-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        .retry-btn {
            margin-top: 24px;
            padding: 12px 22px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .retry-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="offline-container">
    <div class="offline-card">

        <div class="offline-icon">
            <img
                src="/hr-stack-frontend/icons/icon-192.png"
                alt="HR-Stack"
            />
        </div>

        <h1>You're offline</h1>

        <p>
            HR-Stack is currently unable to connect to the server.
            Please check your internet connection and try again.
        </p>

        <button
            class="retry-btn"
            onclick="window.location.reload()"
        >
            Try Again
        </button>

    </div>
</div>

</body>
</html>
